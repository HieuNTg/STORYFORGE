# pyproject.toml — StoryForge project configuration
# Coverage config for Q1: Code Coverage Reporting

[project]
name = "storyforge"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Directories pytest discovers tests in
testpaths = ["tests"]
# Default options: coverage plugin with source dirs
addopts = [
    # Block real network in tests (unmocked LLM calls must fail fast, not hang
    # the suite or spend API quota). Localhost stays open for asyncio internals
    # and local test servers. Opt back in per-test with @pytest.mark.enable_socket.
    "--disable-socket",
    "--allow-hosts=127.0.0.1,::1",
    "--cov=pipeline",
    "--cov=services",
    "--cov=api",
    "--cov=middleware",
    "--cov=errors",
    "--cov=models",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=75",
]
# asyncio mode for async tests
asyncio_mode = "auto"
# Hard per-test ceiling (pytest-timeout) — a stuck test fails itself instead of
# hanging the whole suite. Override per-test with @pytest.mark.timeout(N).
timeout = 120
# Custom markers (Sprint 2 P7)
markers = [
    "calibration: real-model calibration tests (slow; loads sentence-transformers)",
    "perf: performance benchmarks (10-chapter pipeline timing)",
    "bench: async-nesting perf bench (Sprint 3 P8; excluded from default suite)",
    "unit: fast, isolated unit test (informational; not used to select tests)",
]

[tool.coverage.run]
# Source directories to measure
source = [
    "pipeline",
    "services",
    "api",
    "middleware",
    "errors",
    "models",
]
# Patterns to omit from measurement
omit = [
    "tests/*",
    "scripts/*",
    "**/__pycache__/*",
    "*.pyc",
    "setup.py",
    "conftest.py",
]
# Include branch coverage for more thorough reporting
branch = true

[tool.coverage.report]
# Coverage floor — set below the measured total after removing coverage filler
# (76.88% on Windows) to leave room for platform differences on Linux CI.
# Keep in step with --cov-fail-under above and .coveragerc.
fail_under = 75
# Show lines that are not covered
show_missing = true
# Skip files with 100% coverage in the detailed report (reduces noise)
skip_covered = false
# Exclude lines matching these patterns from coverage counts
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "@(abc\\.)?abstractmethod",
]
# Minimum coverage per file (optional — comment out if too strict)
# precision = 2

[tool.coverage.html]
directory = "htmlcov"
title = "StoryForge Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export names on purpose; tests and production
# patch through these aliases, so F401 must not remove them.
"**/__init__.py" = ["F401"]
# Tests stub sys.modules / monkeypatch state before importing the code under
# test; scripts insert the repo root into sys.path before any project import.
# In both, import-after-statement (E402) is load-bearing, not accidental.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
# app.py installs warnings filters that must run before importing the modules
# that would emit those warnings at import time.
"app.py" = ["E402"]
