name: Release images

# Pushing a tag v1.2.3 publishes ghcr.io/<owner>/storyforge-{api,web}:1.2.3
# plus 1.2 and latest, for linux/amd64 and linux/arm64. A pre-release tag
# (v1.2.3-rc.1) publishes only its own version, never latest.
# compose.release.yaml runs them with STORYFORGE_VERSION=1.2.3.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: storyforge-api
            context: .
            file: docker/api.Dockerfile
          - name: storyforge-web
            context: frontend
            file: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        # GHCR repository names must be lowercase.
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          # latest is spelled out rather than left to flavor latest=auto.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
