name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-test.txt
      - name: Install dependencies
        # The lock pins torch==X+cpu, which only exists on the PyTorch CPU index.
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock.txt -r requirements-test.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q -m "not calibration and not bench and not perf"

  lock:
    # requirements.lock.txt must match requirements.txt. Recompile with the
    # current lock as the starting point (uv keeps existing pins it can), so
    # only a change to requirements.txt, not a new upstream release, shows up
    # as a diff. The 2-line header names the output path, so it is skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check requirements.lock.txt is in sync
        run: |
          cp requirements.lock.txt /tmp/lock.txt
          uv pip compile requirements.txt --python-version 3.12 \
            --python-platform x86_64-manylinux_2_28 --torch-backend cpu \
            -o /tmp/lock.txt
          if ! diff <(tail -n +3 requirements.lock.txt) <(tail -n +3 /tmp/lock.txt); then
            echo "::error file=requirements.lock.txt::out of sync with requirements.txt; regenerate it with the command in its header"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run

  audit:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Python audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    # Slow (torch wheels): only for PRs and the default branch.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build images (no push)
        run: docker compose build
